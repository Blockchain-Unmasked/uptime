name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Lint
        run: shellcheck check.sh tests/run.sh tests/fake-gh
      - name: Targets file is valid
        run: ./check.sh --validate
      - name: Scenarios
        run: ./tests/run.sh
