name: Uptime

on:
  schedule:
    # Every 5 minutes. GitHub runs schedules on a best-effort basis, so a run
    # can start a few minutes late when Actions is busy.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Opens, updates and closes outage issues. No write access to the code.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - name: Check production
        env:
          GH_TOKEN: ${{ github.token }}
          ALERT_MENTIONS: ${{ vars.ALERT_MENTIONS }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: ./check.sh

  # GitHub turns off scheduled workflows in a public repo after 60 days
  # without a commit. Commit a date stamp when the last commit is 45 days old
  # so the checks never stop on their own. Its own job, so only this step can
  # push.
  keepalive:
    needs: check
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Keep the schedule running
        run: |
          last="$(git log -1 --format=%ct)"
          if (( $(date +%s) - last > 45 * 86400 )); then
            date -u +%Y-%m-%d > .keepalive
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .keepalive
            git commit -m "Keep the uptime schedule running"
            git push
          fi
